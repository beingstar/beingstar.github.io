# NexT Theme Configuration
# Gemini scheme is the most modern & clean style
scheme: Gemini

# Dark Mode
darkmode: true

# Site Information
favicon:
  small: /images/favicon-16x16-next.png
  medium: /images/favicon-32x32-next.png
  apple_touch_icon: /images/apple-touch-icon-next.png

# Menu
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  #schedule: /schedule/ || fa fa-calendar
  #sitemap: /sitemap.xml || fa fa-sitemap
  #commonweal: /404/ || fa fa-heartbeat

# Sidebar
sidebar:
  position: left
  display: post

# Avatar
avatar:
  url: /images/avatar.gif
  rounded: true

# Social Links
social:
  GitHub: https://github.com/ || fab fa-github

# Posts Settings
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# Code Highlight Theme
codeblock:
  theme:
    light: atom-one-light
    dark: atom-one-dark

# Back to top
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Reading progress
reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#37c6c0"
  height: 3px

# TOC (Table of Contents)
toc:
  enable: true
  number: true
  wrap: true
  expand_all: false
  max_depth: 6

# Footer
footer:
  since: 2026
  powered:
    enable: true
  copyright:
    enable: true

# Creative Commons
creative_commons:
  license: by-nc-sa
  sidebar: false
  post: false
  language:

# Local Search
local_search:
  enable: false
